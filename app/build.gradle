plugins { id 'com.android.application' }

android {
    namespace 'pro.strelk.game'
    compileSdk 35
    defaultConfig {
        applicationId 'pro.strelk.game'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // Pass -PstrelkRewarded=R-M-... and -PstrelkInterstitial=R-M-...
        def rewarded = project.findProperty('strelkRewarded') ?: ''
        def interstitial = project.findProperty('strelkInterstitial') ?: ''
        buildConfigField 'String', 'REWARDED_ID', '"' + rewarded + '"'
        buildConfigField 'String', 'INTERSTITIAL_ID', '"' + interstitial + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
}

dependencies {
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'androidx.annotation:annotation:1.8.2'
}