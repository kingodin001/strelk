plugins { id 'com.android.application' }

android {
    namespace 'pro.strelk.game'
    compileSdk 35
    defaultConfig {
        applicationId 'pro.strelk.game'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
}

// Fully offline game: no advertising, analytics, billing or network SDKs.
dependencies {}
